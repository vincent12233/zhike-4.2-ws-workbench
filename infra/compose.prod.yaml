services:
  postgres:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    networks: [zhike_internal]
  api:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
  ai-worker:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
  ws-connector:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
  backup:
    restart: unless-stopped

networks:
  zhike_internal:
    internal: true
  # API-only bridge required for Docker Desktop to bind the loopback port.
  # Masquerading stays disabled so this network is not a general egress path.
  zhike_ingress:
    driver: bridge
    internal: false
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
    ipam:
      config:
        - subnet: ${ZHike_DOCKER_LOOPBACK_PAIRING_SOURCE_CIDR:-172.31.240.0/24}
  # Only ai-worker and ws-connector attach to this network in the base file.
  # PostgreSQL and backup remain internal-only; the API-only ingress bridge is
  # the exception needed for its loopback publish.
  zhike_egress:
    driver: bridge
    internal: false
