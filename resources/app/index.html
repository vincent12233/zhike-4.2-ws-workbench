<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#071017" />
  <meta name="description" content="本机数据优先、可选 GPT 联网能力的客户运营工作台" />
  <title>知客 6.0 · Horizon Atelier</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./modules/v4.css" />
  <link rel="stylesheet" href="./modules/gpt-assistant.css" />
  <link rel="stylesheet" href="./modules/gpt-workbench.css" />
  <link rel="stylesheet" href="./modules/gpt-modern.css" />
  <link rel="stylesheet" href="./modules/gpt-management.css" />
  <link rel="stylesheet" href="./modules/phone-registry.css" />
  <link rel="stylesheet" href="./modules/business-enhancements.css" />
  <link rel="stylesheet" href="./modules/v41-ui.css" />
  <link rel="stylesheet" href="./modules/operations-upgrade.css" />
  <link rel="stylesheet" href="./modules/ui-refresh.css" />
  <link rel="stylesheet" href="./modules/ws-workbench.css" />
  <link rel="stylesheet" href="./modules/design-system.css" />
  <link rel="stylesheet" href="./modules/horizon-atelier.css" />
  <link rel="stylesheet" href="./modules/business-6.css" />
  <link rel="stylesheet" href="./modules/operations-6.css" />
  <link rel="stylesheet" href="./modules/global-6.css" />
  <link rel="stylesheet" href="./modules/home-6.css" />
  <link rel="stylesheet" href="./modules/scroll-system.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><img src="./assets/zhike-horizon-logo.png" alt="" draggable="false" /></div>
        <div class="brand-copy"><strong>知客 6.0</strong><span>Horizon Atelier<!-- ZHIKE_BUILD_VERSION --></span></div>
        <button class="icon-button collapse-button" id="collapseNav" title="收起导航" aria-label="收起导航" aria-expanded="true"><svg><use href="#i-chevron-left"/></svg></button>
      </div>
      <button class="workspace-switch" id="workspaceSwitch" type="button" title="设置工作区资料"><div class="workspace-dot"></div><div><strong id="workspaceName">本地客户库</strong><span id="workspaceSubtitle">离线数据空间</span></div><svg><use href="#i-chevron-down"/></svg></button>
      <nav class="nav-groups" id="mainNav">
        <div class="nav-group-label">工作</div>
        <button class="nav-item active" data-view="home"><svg><use href="#i-home"/></svg><span>今日工作台</span></button>
        <button class="nav-item" data-view="intake"><svg><use href="#i-zap"/></svg><span>快速录入</span></button>
        <button class="nav-item" data-view="operations"><svg><use href="#i-calendar"/></svg><span>任务中心</span></button>
        <button class="nav-item" data-view="stage-board"><svg><use href="#i-grid"/></svg><span>阶段看板</span></button>
        <div class="nav-group-label">客户</div>
        <button class="nav-item" data-view="customers"><svg><use href="#i-users"/></svg><span>客户中心</span><b class="nav-count muted" id="navCustomerCount">0</b></button>
        <button class="nav-item" data-view="segments"><svg><use href="#i-grid"/></svg><span>分类视图</span></button>
        <button class="nav-item" data-view="hot"><svg><use href="#i-message"/></svg><span>热聊管理</span><b class="nav-count coral" id="navHotCount">0</b></button>
        <button class="nav-item" data-view="groups"><svg><use href="#i-layers"/></svg><span>群组管理</span></button>
        <button class="nav-item" data-view="vip"><svg><use href="#i-shield"/></svg><span>VIP 管理</span><b class="nav-count amber" id="navVipCount">0</b></button>
        <div class="nav-group-label">业务数据</div>
        <button class="nav-item" data-view="tickets"><svg><use href="#i-trending"/></svg><span>跟票管理</span><b class="nav-count muted" id="navTicketCount">0</b></button>
        <button class="nav-item" data-view="registrations"><svg><use href="#i-users"/></svg><span>报名统计</span><b class="nav-count muted" id="navRegistrationCount">0</b></button>
        <button class="nav-item" data-view="deposits"><svg><use href="#i-wallet"/></svg><span>入金管理</span></button>
        <button class="nav-item" data-view="analytics"><svg><use href="#i-chart"/></svg><span>统计分析</span></button>
        <div class="nav-group-label">系统管理</div>
        <button class="nav-item" data-view="ws-workbench" id="wsWorkbenchNav"><svg><use href="#i-message"/></svg><span>WS 工作台</span><i class="live-dot"></i></button>
        <button class="nav-item" id="gptAssistantNav"><svg><use href="#i-spark"/></svg><span>GPT 运营助手</span><i class="live-dot"></i></button>
        <button class="nav-item" data-view="automation"><svg><use href="#i-spark"/></svg><span>本地自动化</span><i class="live-dot"></i></button>
        <button class="nav-item" data-view="quality"><svg><use href="#i-shield"/></svg><span>数据治理</span><b class="nav-count amber" id="navQualityCount">0</b></button>
        <button class="nav-item" data-view="data"><svg><use href="#i-database"/></svg><span>数据中心</span></button>
        <button class="nav-item" data-view="activity"><svg><use href="#i-history"/></svg><span>操作记录</span></button>
        <button class="nav-item" data-view="recycle"><svg><use href="#i-x"/></svg><span>回收站</span></button>
        <button class="nav-item" data-view="settings"><svg><use href="#i-settings"/></svg><span>系统设置</span></button>
        <button class="nav-item" data-view="phone-registry"><svg><use href="#i-phone"/></svg><span>手机号登记</span><b class="nav-count muted" id="navPhoneRegistryCount">0</b></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="storage-card"><div class="storage-icon"><svg><use href="#i-database"/></svg></div><div class="storage-copy"><strong id="storageModeTitle">本机存储正常</strong><span id="storageModeSubtitle">批量写入前自动快照</span></div><span class="status-dot"></span></div>
        <button class="profile-button" title="管理本地管理员头像" aria-label="管理本地管理员头像"><div class="profile-avatar">管</div><div><strong id="adminName">本地管理员</strong><span>个人工作区</span></div><svg><use href="#i-more"/></svg></button>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="breadcrumbs"><span>工作台</span><svg><use href="#i-chevron-right"/></svg><strong id="crumbCurrent">今日工作台</strong></div>
        <div class="home-top-title"><h1>今日工作台</h1><span>AI 驱动的客户跟进与业务增长工作台</span></div>
        <div class="top-actions">
          <button class="global-search" id="globalSearch"><svg><use href="#i-search"/></svg><span>搜索客户、号码、群编号</span><kbd>Ctrl K</kbd></button>
          <div class="offline-pill"><span class="status-dot"></span><span id="storageModeBadge">本机优先</span></div>
          <button class="top-icon" id="shortcutButton" title="快捷键与使用帮助" aria-label="快捷键与使用帮助">?</button>
          <button class="top-icon" id="backupButton" title="立即备份"><svg><use href="#i-cloud-down"/></svg></button>
          <span class="sync-status online" id="syncStatus" title="所有页面共享同一份本机数据库">已保存到本机</span><button class="top-icon notification-button" id="notificationButton" title="本地提醒" aria-label="本地提醒"><svg><use href="#i-bell"/></svg><i></i></button>
          <button class="top-avatar" title="管理本地管理员头像" aria-label="管理本地管理员头像">管</button>
        </div>
      </header>
      <section class="view-container" id="viewContainer"></section>
      <footer class="app-footer"><span id="storageModeFooter"><i class="status-dot"></i>离线运行 · 数据仅保存在本机</span><span id="footerCount">本地客户库 · 0 位客户</span><span>本地自动快照 · 保留数量可配置</span></footer>
    </main>
  </div>

  <div class="toast-region" id="toastRegion" aria-live="polite"></div>
  <div class="modal-backdrop hidden" id="modalBackdrop">
    <section class="modal" id="modal" role="dialog" aria-modal="true"></section>
  </div>
