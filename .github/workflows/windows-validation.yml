name: Windows installer and isolated WS validation

on:
  push:
    branches: ['feature/zhike61-ws-completion']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.100
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: Build the production WinUI application
        run: dotnet build desktop/src/Zhike.Desktop/Zhike.Desktop.csproj -c Release -r win-x64 -p:Platform=x64 -p:PlatformTarget=x64 --nologo
      - name: Validate isolated collection, group queries and database startup
        shell: pwsh
        run: |
          $env:ZHIKE_TEST_NODE = (Get-Command node).Source
          $env:ZHIKE_TEST_DOTNET = (Get-Command dotnet).Source
          $tests = @(
            'tests/rd02-authenticated-profile-boundary.test.cjs',
            'tests/ws-independent-collector-runtime.test.cjs',
            'tests/delivery-rd02-ws-capability.test.cjs',
            'tests/ws-group-manager-production.test.cjs',
            'tests/ws-workspace-policy.test.cjs',
            'tests/ws-ai-workspace-mode.test.cjs',
            'tests/ws-ai-queue-workspace-mode.test.cjs',
            'tests/ws-ai-pump-runtime.test.cjs',
            'tests/ws-ingest-workspace-mode.test.cjs',
            'tests/ws-group-drafts-api.test.cjs',
            'tests/ws-group-drafts-ui.test.cjs',
            'tests/ws-group-reading-workspace.test.cjs',
            'tests/ws-group-permission-pages.test.cjs',
            'tests/ws-reply-draft-recovery-runtime.test.cjs',
            'tests/ws-group-monitor-workspace-mode.test.cjs',
            'tests/ws-group-monitor-identity-safety.test.cjs',
            'tests/ws-group-monitor-ingest.test.cjs',
            'tests/ws-group-scope-authorization.test.cjs',
            'tests/ws-group-scope-bridge.test.cjs',
            'tests/ws-contact-exclusion.test.cjs',
            'tests/ws-contact-exclusion-safety.test.cjs',
            'tests/ws-contact-exclusion-api.test.cjs',
            'tests/ws-contact-exclusion-ui.test.cjs',
            'tests/ws-native-account-registration.test.cjs',
            'tests/ws-native-purpose-policy.test.cjs',
            'tests/ws-ai-authorization-budget.test.cjs',
            'tests/ws-native-write-authority.test.cjs',
            'tests/ws-native-write-authority-core.test.cjs',
            'tests/ws-group-drafts-backup.test.cjs',
            'tests/ws-group-drafts-restore-core.test.cjs',
            'tests/native-backup-restore.test.cjs',
            'desktop/tests/LegacyBridgeContractTests.cjs',
            'tests/ws-account-workspace-mode.test.cjs',
            'tests/ws-account-runtime-recovery.test.cjs',
            'tests/ws-account-metrics-native.test.cjs',
            'tests/ws-account-metrics-ui.test.cjs',
            'tests/ws-workspace-mode-ui.test.cjs',
            'tests/ws-background-isolation.test.cjs',
            'tests/ws-workbench-security.test.cjs',
            'tests/desktop-packaging-contract.test.cjs',
            'tests/packaged-workspace-webview-contract.test.cjs',
            'tests/release-gate-contract.test.cjs',
            'tests/previous-installer-upgrade.test.cjs',
            'tests/legacy-install-retirement.test.cjs',
            'tests/current-docs-consistency.test.cjs',
            'scripts/stage1/migration-runner-fresh-atomic.test.cjs'
          )
          foreach ($test in $tests) {
            node $test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Verify AI provider selection and outbound requests with local fixtures
        shell: pwsh
        run: |
          node tests/gpt-assistant-session.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/stage55c/gpt-provider-race-runtime.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project desktop/tests/AiBridgeProviderRuntime/AiBridgeProviderRuntime.csproj -c Release
      - name: Prepare the official Node runtime and Inno Setup compiler
        shell: pwsh
        run: |
          ./tests/build-tool-discovery.test.ps1
          Copy-Item (Get-Command node).Source resources/app/node.exe
          New-Item -ItemType Directory -Force work/tools | Out-Null
          $installer = Join-Path $PWD 'work/tools/innosetup-7.1.1-x64.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne '8A5A6711C3766A6E5FB74F280BA0E3551E719CE94538D901FDBD1F8F9920B3F0') {
            throw 'The Inno Setup download does not match its official release digest.'
          }
          $compilerDir = Join-Path $PWD 'work/tools/inno'
          $process = Start-Process $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', ('/DIR="' + $compilerDir + '"')) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed: $($process.ExitCode)" }
          $compiler = Join-Path $compilerDir 'ISCC.exe'
          if (!(Test-Path $compiler) -or !(Test-Path (Join-Path $compilerDir 'Languages/ChineseSimplified.isl'))) {
            throw 'The compiler or Simplified Chinese installer language is missing.'
          }
          "INNO_SETUP_COMPILER=$compiler" >> $env:GITHUB_ENV
      - name: Build the self-contained release bundle and installer
        shell: pwsh
        run: |
          ./scripts/build-winui-bundle.ps1 -Version 6.1.0 -ReleaseGate
          ./scripts/build-winui-installer.ps1 -AppVersion 6.1.0 -ReleaseGate -OutputDir (Join-Path $PWD 'work/candidate-installer')
      - name: Probe the packaged sidecar with an isolated empty database
        shell: pwsh
        run: |
          dotnet run --project scripts/stage51/NativeReadinessProbe/NativeReadinessProbe.csproj -c Release -- (Join-Path $PWD 'work/winui-bundle/zhike-winui-6.1.0-win-x64/resources/app') | Tee-Object -FilePath work/candidate-installer/sidecar-readiness.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify clean install, rc.3 upgrade and uninstall on the CI machine
        shell: pwsh
        run: |
          $runtimeKeys = @('HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}', 'HKLM:\Software\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}')
          $runtime = $runtimeKeys | ForEach-Object { Get-ItemProperty $_ -ErrorAction SilentlyContinue } | Where-Object { $_.pv -match '^\d+\.\d+\.\d+\.\d+$' -and [Version]$_.pv -gt [Version]'0.0.0.0' }
          if (!$runtime) {
            $bootstrapper = Join-Path $PWD 'work/tools/MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $bootstrapper
            $signature = Get-AuthenticodeSignature $bootstrapper
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'CN=Microsoft Corporation,') { throw 'Invalid Microsoft WebView2 bootstrapper signature.' }
            $process = Start-Process $bootstrapper -ArgumentList '/silent /install' -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "WebView2 installation failed: $($process.ExitCode)" }
          }
          $manifest = Get-Content work/candidate-installer/release-output-manifest.json -Raw | ConvertFrom-Json
          ./scripts/verify-winui-installer.ps1 -InstallerPath (Join-Path $PWD "work/candidate-installer/$($manifest.installer)") -StageDir (Join-Path $PWD 'work/winui-bundle/zhike-winui-6.1.0-win-x64') -OutputDir (Join-Path $PWD 'work/installer-smoke') -VerifyPreviousReleaseUpgrade
      - name: Render packaged ordinary and dedicated workspaces in isolated WebView2
        shell: pwsh
        run: |
          $sdk = (Get-Command dotnet).Source
          $env:ZHIKE_EDGE_OBSERVER_DOTNET = $sdk
          $hostOutput = Join-Path $PWD ('work/packaged-webview-host/' + [Guid]::NewGuid().ToString('N'))
          & $sdk build tests/native/IsolatedWebViewHost/IsolatedWebViewHost.csproj -c Release -p:Platform=x64 -r win-x64 -o $hostOutput --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $sdk build scripts/diagnostics/edge-exit-observer/observer/Observer.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:ZHIKE_TEST_WEBVIEW_HOST = Join-Path $hostOutput 'IsolatedWebViewHost.exe'
          node tests/isolated-webview-native.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/packaged-workspace-webview-smoke.test.cjs (Join-Path $PWD 'work/winui-bundle/zhike-winui-6.1.0-win-x64') (Join-Path $PWD 'work/packaged-webview-smoke')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Collect verified candidate assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force work/candidate-artifact | Out-Null
          $manifest = Get-Content work/candidate-installer/release-output-manifest.json -Raw | ConvertFrom-Json
          $head = git rev-parse HEAD
          if ($manifest.sourceCommit -cne $head -or $manifest.releaseGate -ne 'passed') { throw 'Installer source provenance mismatch.' }
          $installer = Join-Path $PWD "work/candidate-installer/$($manifest.installer)"
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne $manifest.sha256 -or (Get-Item $installer).Length -ne $manifest.bytes) { throw 'Installer digest mismatch.' }
          $installSmoke = Get-Content work/installer-smoke/installer-smoke-result.json -Raw | ConvertFrom-Json
          if ($installSmoke.status -ne 'passed' -or $installSmoke.previousReleaseUpgradeRequested -ne $true -or $installSmoke.checks.previousReleaseUpgrade.status -ne 'passed' -or
              $installSmoke.checks.previousReleaseUpgrade.to.sourceCommit -cne $head -or $installSmoke.checks.previousReleaseUpgrade.to.installerSha256 -ne $manifest.sha256) {
            throw 'Verified rc.3-to-candidate installation evidence is missing or belongs to a different installer.'
          }
          $signature = (Get-AuthenticodeSignature $installer).Status.ToString()
          if (@{ Valid = 'signed-and-verified'; NotSigned = 'unsigned' }[$signature] -ne $manifest.signingStatus) { throw 'Installer signature status mismatch.' }
          Copy-Item $installer (Join-Path $PWD "work/candidate-artifact/$($manifest.releaseAsset)")
          Copy-Item work/candidate-installer/release-output-manifest.json,work/candidate-installer/sidecar-readiness.txt,work/winui-bundle/zhike-winui-6.1.0-win-x64/bundle-manifest.json,work/installer-smoke/installer-smoke-result.json,work/packaged-webview-smoke/packaged-workspace-result.json work/candidate-artifact
          Copy-Item work/installer-smoke/previous-release-provenance.json,work/installer-smoke/previous-release-output-manifest.json work/candidate-artifact
          @(
            '## Windows x64 candidate',
            "Product $($manifest.version) · CI $env:GITHUB_RUN_ID / attempt $env:GITHUB_RUN_ATTEMPT",
            "Commit $($manifest.sourceCommit)",
            "Built $($manifest.generatedAtUtc)",
            "Installer $($manifest.releaseAsset) · $($manifest.bytes) bytes",
            "SHA-256 $($manifest.sha256)",
            "Authenticode $($manifest.signingStatus)"
          ) -join "`n`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: zhike-6.1.0-win-x64-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/candidate-artifact/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve installer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-diagnostics
          path: work/installer-smoke/
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve isolated WebView diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-webview-diagnostics
          path: |
            work/packaged-webview-smoke/
            .tools/native-renderer/controlled-fixture/
          if-no-files-found: ignore
          retention-days: 7
